<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donut</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2330; }
      canvas { display: block; }
      /* Every text is Zen Maru Gothic (OFL), Kabane's font: 500 for the menu, 700 for the banner (ADR 0003). */
      /* The action menu: a classic JRPG window, blue gradient, light rounded border, white text. */
      .menu {
        position: fixed; z-index: 10; min-width: 120px; padding: 6px 4px;
        background: linear-gradient(180deg, #4a6ae0 0%, #2a3fae 55%, #18237a 100%);
        border: 3px solid #eef1ff; border-radius: 7px;
        box-shadow: inset 0 0 0 2px #10195c, 0 3px 0 rgba(16, 25, 92, 0.6);
        font: 500 21px/1.3 'Zen Maru Gothic', sans-serif; color: #fff; text-shadow: 2px 2px 0 #10195c;
        user-select: none;
      }
      .menu[hidden] { display: none; }
      .menu-item {
        display: block; width: 100%; padding: 2px 14px; border: 0; background: none;
        font: inherit; color: inherit; text-shadow: inherit; text-align: left; cursor: inherit;
      }
      .menu-item:hover:not(:disabled) { color: #fff3a8; }
      .menu-item:disabled { color: #8e98d6; }
      .notice {
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
        padding: 8px 14px; border-radius: 6px;
        background: #f6efe2; color: #3f3550; font: 500 14px/1.4 'Zen Maru Gothic', sans-serif;
        box-shadow: 0 2px 0 #3f3550;
      }
      /*
       * The region banner, Dark Souls style but cute: the name in big cream letters with a soft dark outline, a thin
       * line with a small heart under it, no window. It fades in over 0.6 s, stays 2.5 s, and fades out over 1 s.
       */
      .region-banner {
        position: fixed; z-index: 5; left: 0; right: 0; top: 30%;
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        color: #fff4dc; font-family: 'Zen Maru Gothic', sans-serif; text-align: center;
        pointer-events: none; user-select: none; opacity: 0;
        --outline: #3a2e4f;
        text-shadow: -2px 0 var(--outline), 2px 0 var(--outline), 0 -2px var(--outline), 0 2px var(--outline),
          -1px -1px var(--outline), 1px 1px var(--outline), -1px 1px var(--outline), 1px -1px var(--outline),
          0 4px 10px rgba(30, 20, 50, 0.45);
      }
      .region-banner.showing { animation: region-banner 4.1s ease-in-out forwards; }
      .region-banner-stars { font: 700 18px/1 'Zen Maru Gothic', sans-serif; letter-spacing: 6px; color: #ffe3a6; }
      .region-banner-name { font: 700 46px/1.2 'Zen Maru Gothic', sans-serif; letter-spacing: 1px; }
      .region-banner-rule {
        display: flex; align-items: center; gap: 12px; width: min(420px, 80vw);
        font: 700 16px/1 'Zen Maru Gothic', sans-serif; color: #ff9fb8;
      }
      .region-banner-rule::before, .region-banner-rule::after {
        content: ''; flex: 1; height: 2px; border-radius: 1px;
        background: #fff4dc; box-shadow: 0 0 0 1px var(--outline);
      }
      /* 0.6 s in, 2.5 s shown, 1 s out: 4.1 s in all */
      @keyframes region-banner {
        0% { opacity: 0; transform: translateY(6px); }
        14.6% { opacity: 1; transform: translateY(0); }
        75.6% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-4px); }
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
